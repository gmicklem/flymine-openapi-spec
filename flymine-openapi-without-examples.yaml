      description: 'Get configuration properties for the BlueGenes user interface.

        BlueGenes is the modern web interface for InterMine databases.

        '
      operationId: getBlueGenesProperties
      responses:
        '200':
          description: BlueGenes configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: object
              example:
                properties:
                  mineName: FlyMine
