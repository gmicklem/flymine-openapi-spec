        description: Name of the list to analyze
        example: PL FlyTF_site_specific_TFs
      - name: widget
        in: query
        required: true
        schema:
          type: string
        description: Name of the chart widget
        example: flyatlas_for_gene
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - name: token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Chart data
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
              example:
                results:
                  chartType: BarChart
                  chartData:
                    labels:
                    - Brain
                    - Eye
                    - Wing
                    - Leg
                    datasets:
                    - label: Expression Level
                      data:
                      - 45.2
                      - 67.8
                      - 23.1
                      - 34.5
  /list/table:
    get:
      tags:
      - widget
      - list
      summary: Get table widget data for a list
      description: 'Generate tabular data for table widgets based on list contents.

        Provides structured data for display in table format.

        '
      operationId: listTable
      parameters:
      - name: list
        in: query
        required: true
        schema:
          type: string
        description: Name of the list
        example: Gap_Genes
      - name: widget
        in: query
        required: true
        schema:
          type: string
        description: Name of the table widget
        example: interactions_for_gene
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          - tsv
          - csv
          default: json
      - name: token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Table data
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
              example:
                results:
                - gene1: eve
                  gene2: ftz
                  type: genetic
                  confidence: high
                - gene1: eve
                  gene2: hb
                  type: physical
                  confidence: medium
  /query/upload:
    post:
      tags:
      - query
      summary: Upload and execute a saved query
      description: 'Upload a saved query in XML or JSON format and execute it.

        Useful for running complex saved queries.

        '
      operationId: queryUpload
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              format: xml
            example: "<query name=\"Complex Gene Query\" model=\"genomic\" view=\"Gene.primaryIdentifier Gene.symbol Gene.length\"\
              >\n  <constraint path=\"Gene.goAnnotation.ontologyTerm.name\" op=\"CONTAINS\" value=\"DNA binding\"/>\n  <constraint\
              \ path=\"Gene.organism.name\" op=\"=\" value=\"Drosophila melanogaster\"/>\n  <constraint path=\"Gene.length\"\
              \ op=\">\" value=\"1000\"/>\n  <constraint path=\"Gene.length\" op=\"<\" value=\"10000\"/>\n</query>\n"
          application/json:
            schema:
              type: object
            example:
              from: Gene
              select:
              - primaryIdentifier
              - symbol
              - length
              where:
              - path: goAnnotation.ontologyTerm.name
                op: CONTAINS
                value: DNA binding
              - path: organism.name
                op: '='
                value: Drosophila melanogaster
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          - tsv
          - csv
          default: json
      - name: token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Query results
  /template/tags:
    get:
      tags:
      - template
      summary: Get template tags
      description: 'Get all tags used for categorizing and organizing templates.

        '
      operationId: getTemplateTags
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      responses:
        '200':
          description: Template tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: string
              example:
                tags:
                - im:aspect:Genomics
                - im:aspect:Proteins
                - im:aspect:Function
                - im:aspect:Homology
                - im:aspect:Publications
                - im:frontpage
                - im:converter
  /template/tolist:
    post:
      tags:
      - template
      - list
      summary: Save template results as list
      description: 'Execute a template query and save the results as a new list.

        '
      operationId: templateToList
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - name
              - listName
              properties:
                name:
                  type: string
                  description: Name of the template to execute
                listName:
                  type: string
                  description: Name for the new list
                constraint1:
                  type: string
                op1:
                  type: string
                value1:
                  type: string
                extra1:
                  type: string
                description:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                token:
                  type: string
            example:
              name: Gene_Pathways
              listName: Hedgehog_Pathway_Genes_List
              constraint1: Gene.pathways.name
              op1: CONTAINS
              value1: hedgehog
              extra1: D. melanogaster
              description: Genes in hedgehog signaling pathway
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List created from template results
          content:
            application/json:
              schema:
                type: object
                properties:
                  listName:
                    type: string
                  size:
                    type: integer
                  type:
                    type: string
              example:
                listName: Hedgehog_Pathway_Genes_List
                size: 42
                type: Gene
  /query/code:
    get:
      tags:
      - query
      summary: Generate code for a query
      description: 'Generate client code in various programming languages for executing a query.

        Useful for integrating FlyMine queries into custom applications.

        '
      operationId: queryCode
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: PathQuery in XML or JSON format
        example: "<query model=\"genomic\" view=\"Gene.symbol Gene.primaryIdentifier\">\n  <constraint path=\"Gene.symbol\"\
          \ op=\"=\" value=\"eve\"/>\n</query>\n"
      - name: lang
        in: query
        required: true
        schema:
          type: string
          enum:
          - python
          - perl
          - java
          - ruby
          - javascript
          - curl
        description: Target programming language
        example: python
      responses:
        '200':
          description: Generated code
          content:
            text/plain:
              schema:
                type: string
              example: "#!/usr/bin/env python\n\nfrom intermine.webservice import Service\n\nservice = Service(\"https://www.flymine.org/flymine/service\"\
                )\nquery = service.new_query(\"Gene\")\nquery.add_view(\"symbol\", \"primaryIdentifier\")\nquery.add_constraint(\"\
                symbol\", \"=\", \"eve\")\n\nfor row in query:\n    print(row[\"symbol\"], row[\"primaryIdentifier\"])\n"
  /facet-list:
    get:
      tags:
      - search
      summary: Get facets for a list
      description: 'Get faceted search results for items in a specific list.

        '
      operationId: getFacetList
      parameters:
      - name: list
        in: query
        required: true
        schema:
          type: string
        description: Name of the list
        example: PL FlyBase_Annotation_IDs
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - name: token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Faceted list data
  /user/queries:
    get:
      tags:
      - user
      - query
      summary: Get saved queries
      description: 'Get all saved queries for the authenticated user.

        '
      operationId: getUserQueries
      security:
      - tokenAuth: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      responses:
        '200':
          description: User's saved queries
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        created:
                          type: string
                          format: date-time
              example:
                queries:
                - name: My_TF_Search
                  description: Transcription factors with DNA binding
                  created: '2023-10-15T14:30:00Z'
                - name: Wing_Development_Genes
                  description: Genes involved in wing morphogenesis
                  created: '2023-10-20T09:15:00Z'
    post:
      tags:
      - user
      - query
      summary: Save a query
      description: 'Save a query for later use by the authenticated user.

        '
      operationId: saveUserQuery
      security:
      - tokenAuth: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - name
              - query
              properties:
                name:
                  type: string
                  description: Name for the saved query
                query:
                  type: string
                  description: Query in XML or JSON format
                description:
                  type: string
                token:
                  type: string
            example:
              name: Neural_Genes
              query: "{\n  \"from\": \"Gene\",\n  \"select\": [\"symbol\", \"primaryIdentifier\"],\n  \"where\": [\n    {\"\
                path\": \"goAnnotation.ontologyTerm.name\", \"op\": \"CONTAINS\", \"value\": \"neural\"},\n    {\"path\":\
                \ \"organism.name\", \"op\": \"=\", \"value\": \"Drosophila melanogaster\"}\n  ]\n}\n"
              description: Genes involved in neural development
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Query saved successfully
  /branding:
