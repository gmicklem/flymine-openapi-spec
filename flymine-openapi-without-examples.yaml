                  reportWidgets:
                  - ProteinAtlasExpression
                  - FlyAtlas
                  - Publications
                  listWidgets:
                  - go_enrichment
                  - pathway_enrichment
  /lists/jaccard-index:
    get:
      tags:
      - list
      summary: Calculate Jaccard index between lists
      description: 'Calculate the Jaccard similarity coefficient between two lists.

        The Jaccard index measures similarity as the size of the intersection

        divided by the size of the union of the lists.

        '
      operationId: listsJaccardIndex
      parameters:
      - name: lists
        in: query
        required: true
        schema:
          type: string
        description: Semicolon-separated list names to compare
        example: Gap_Genes;Hox_Genes
      - name: token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Jaccard similarity coefficient
          content:
            application/json:
              schema:
                type: object
                properties:
                  jaccardIndex:
                    type: number
                    minimum: 0
                    maximum: 1
                  intersection:
                    type: integer
                  union:
                    type: integer
                  list1Size:
                    type: integer
                  list2Size:
                    type: integer
              example:
                jaccardIndex: 0.125
                intersection: 2
                union: 16
                list1Size: 9
                list2Size: 9
  /listswithobject:
    get:
      tags:
      - list
      summary: Find lists containing an object
      description: 'Find all lists that contain a specific object identified by its database ID.

        Useful for discovering which lists include a particular gene or other entity.

        '
      operationId: listsWithObject
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
        description: Database ID of the object
        example: 1007656
      - name: token
        in: query
        schema:
          type: string
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      responses:
        '200':
          description: Lists containing the object
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        size:
                          type: integer
                        type:
                          type: string
                        description:
                          type: string
              example:
                lists:
                - name: Gap_Genes
                  size: 9
                  type: Gene
                  description: Drosophila gap genes
                - name: Segmentation_Genes
                  size: 45
                  type: Gene
                  description: All segmentation genes
  /schema:
    get:
      tags:
      - model
      summary: Get API schema information
      description: 'Get schema definitions for the API, including available schemas for

        queries, templates, and other API components.

        '
      operationId: getSchema
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      responses:
        '200':
          description: Available schemas
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        url:
                          type: string
              example:
                schemas:
                - name: query.xsd
                  description: XML Schema for PathQuery format
                  url: /schema/query.xsd
                - name: template.xsd
                  description: XML Schema for template queries
                  url: /schema/template.xsd
  /template/upload:
    post:
      tags:
      - template
      summary: Upload a template
      description: 'Upload a new template query for reuse. Templates are pre-configured

        queries with parameters that can be easily executed with different values.

        '
      operationId: templateUpload
      security:
      - tokenAuth: []
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              format: xml
            example: "<template name=\"Genes_In_Pathway\" title=\"Genes in a specific pathway\">\n  <query model=\"genomic\"\
