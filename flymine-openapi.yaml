                  type: array
                  items:
                    type: string
                  description: List of identifiers to resolve
                type:
                  type: string
                  description: Type of objects to resolve to
                extra:
                  type: string
                  description: Additional disambiguation value
                caseSensitive:
                  type: boolean
                  default: false
                wildCards:
                  type: boolean
                  default: false
            examples:
              originalServiceExample:
                summary: Original example from service.json
                value:
                  identifiers:
                    - "eve"
                    - "zen"
                    - "bib"
                  type: "Gene"
                  caseSensitive: true
                  wildCards: true
                  extra: "D. melanogaster"
              mixedIdentifiers:
