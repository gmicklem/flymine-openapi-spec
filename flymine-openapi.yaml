      summary: Get features overlapping genomic regions as GFF3
      operationId: regionsGFF3Post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - regions
                - featureTypes
                - organism
              properties:
                regions:
                  type: array
                  items:
                    type: string
                  description: Genomic intervals
                featureTypes:
                  type: array
                  items:
                    type: string
                  description: Types of features to find
                organism:
                  type: string
                  description: Organism name
                isInterbase:
                  type: boolean
                extension:
                  type: number
            examples:
              originalServiceExample:
                summary: Original genomic regions from service.json
                value:
                  regions:
                    - "2L:14615455..14619002"
                    - "2R:5866646..5868384"
                    - "3R:2578486..2580016"
                  featureTypes:
                    - "Gene"
                    - "Exon"
                    - "Intron"
                  organism: "D. melanogaster"
                  extension: 1000
              eveGeneRegion:
                summary: Genomic region around eve gene
