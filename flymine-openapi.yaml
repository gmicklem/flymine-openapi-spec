openapi: 3.0.3
info:
  title: FlyMine Web Services API
  description: |
    FlyMine is an integrated database for Drosophila genomics providing powerful search and
    data warehousing capabilities for accessing integrated genomic, proteomic, and genetic data
    for Drosophila and related organisms. This API provides RESTful web services powered by
    InterMine, an open-source biological data warehouse system.

    ## Authentication
    Some endpoints require authentication via API token. Obtain a token using the /user/token endpoint
    with username and password, then include it as a query parameter in subsequent requests.

    ## Formats
    Most endpoints support multiple output formats including JSON, XML, TSV, and CSV.
  version: 31.0.0
  contact:
    name: FlyMine Support
    email: support@flymine.org
    url: https://www.flymine.org/
  license:
    name: LGPL-2.1
    url: https://www.gnu.org/licenses/old-licenses/lgpl-2.1.en.html
servers:
  - url: https://www.flymine.org/flymine/service
    description: FlyMine production server
tags:
  - name: query
    description: Query operations for retrieving genomic data
  - name: template
    description: Pre-configured query templates
  - name: list
    description: List management operations
  - name: search
    description: Search operations
  - name: export
    description: Data export in specialized formats
  - name: genomic-regions
    description: Genomic interval operations
  - name: user
    description: User account and authentication
  - name: model
    description: Data model operations
  - name: widget
    description: Data visualization widgets
  - name: id-resolution
    description: Identifier resolution services

paths:
  /query/results:
    get:
      tags:
        - query
      summary: Execute a query
      description: |
        Execute a PathQuery to retrieve data from FlyMine. Queries can be submitted
        in XML or JSON format and results can be returned in various formats.
      operationId: queryResultsGet
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: A definition of the query to execute in Path-Query XML or JSON format
          examples:
            shortGenesXChromosome:
              summary: Short genes on X chromosome (from original service.json)
              value: |
                <query name="short genes on the X chromosome" model="genomic" view="Gene.id Gene.exons.id">
                  <constraint path="Gene.chromosome.primaryIdentifier" op="=" value="X"/>
                  <constraint path="Gene.length" op="<" value="1000"/>
                </query>
            eveGeneQuery:
              summary: Query for even-skipped gene
              value: |
                <query name="eve gene query" model="genomic" view="Gene.primaryIdentifier Gene.symbol Gene.name Gene.length Gene.chromosome.primaryIdentifier Gene.chromosomeLocation.start Gene.chromosomeLocation.end">
                  <constraint path="Gene.symbol" op="=" value="eve"/>
                  <constraint path="Gene.organism.name" op="=" value="Drosophila melanogaster"/>
                </query>
            multipleGenesJSON:
              summary: JSON query for multiple developmental genes
              value: |
                {
                  "from": "Gene",
                  "select": ["primaryIdentifier", "symbol", "name", "length", "chromosome.primaryIdentifier"],
                  "where": [
                    {"path": "organism.name", "op": "=", "value": "Drosophila melanogaster"},
                    {"path": "symbol", "op": "ONE OF", "values": ["eve", "ftz", "zen", "hb", "Kr"]}
                  ],
                  "orderBy": [{"path": "symbol", "direction": "ASC"}]
                }
            transcriptionFactorGenes:
              summary: Genes with transcription factor activity
              value: |
                <query name="transcription factor genes" model="genomic" view="Gene.primaryIdentifier Gene.symbol Gene.name Gene.goAnnotation.ontologyTerm.name">
                  <constraint path="Gene.goAnnotation.ontologyTerm.name" op="CONTAINS" value="transcription factor"/>
                  <constraint path="Gene.organism.name" op="=" value="Drosophila melanogaster"/>
                </query>
            notchPathwayGenes:
              summary: Genes in Notch signaling pathway
              value: |
                {
                  "from": "Gene",
                  "select": ["primaryIdentifier", "symbol", "name", "pathways.name"],
                  "where": [
                    {"path": "organism.name", "op": "=", "value": "Drosophila melanogaster"},
                    {"path": "pathways.name", "op": "CONTAINS", "value": "Notch"}
                  ]
                }
            winglessProteinDomains:
              summary: Protein domains of wingless gene
              value: |
                <query name="wingless protein domains" model="genomic" view="Gene.symbol Gene.proteins.primaryIdentifier Gene.proteins.proteinDomains.name Gene.proteins.proteinDomains.description">
                  <constraint path="Gene.symbol" op="=" value="wingless"/>
                  <constraint path="Gene.organism.name" op="=" value="Drosophila melanogaster"/>
                </query>
        - name: format
          in: query
          schema:
            type: string
            enum:
              [
                tab,
                csv,
                count,
                json,
                jsonobjects,
                jsoncount,
                xml,
                html,
                rdf+xml,
              ]
            default: tab
          description: Output format
        - name: start
          in: query
          schema:
            type: integer
            default: 0
          description: The index of the first result to return
        - name: size
          in: query
          schema:
            type: integer
            default: 10
          description: The maximum size of the result set
          example: 50
        - name: columnheaders
          in: query
          schema:
            type: string
            enum: [none, path, friendly]
            default: none
          description: Include column headers (only for flat-file formats)
        - name: token
          in: query
          schema:
            type: string
          description: Authentication token for private data access
          example: "abc123def456"
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                  executionTime:
                    type: integer
                  wasSuccessful:
                    type: boolean
                  error:
                    type: string
                  statusCode:
                    type: integer
              examples:
                shortGenesResponse:
                  summary: Response for short genes query
                  value:
                    results:
                      - ["FBgn0000008", "a", "893", "X"]
                      - ["FBgn0000606", "eve", "7784", "2R"]
                      - ["FBgn0001077", "ftz", "1062", "3R"]
                      - ["FBgn0004053", "zen", "583", "3R"]
                      - ["FBgn0001180", "hb", "746", "3R"]
                    executionTime: 234
                    wasSuccessful: true
                    statusCode: 200
                eveGeneResponse:
                  summary: Response for eve gene query
                  value:
                    results:
                      - [
                          "FBgn0000606",
                          "eve",
                          "even-skipped",
                          "7784",
                          "2R",
                          "5865334",
                          "5873117",
                        ]
                    executionTime: 142
                    wasSuccessful: true
                    statusCode: 200
                transcriptionFactorResponse:
                  summary: Response for transcription factor genes
                  value:
                    results:
                      - [
                          "FBgn0000606",
                          "eve",
                          "even-skipped",
                          "DNA-binding transcription factor activity",
                        ]
                      - [
                          "FBgn0001077",
                          "ftz",
                          "fushi tarazu",
                          "DNA-binding transcription factor activity",
                        ]
                      - [
                          "FBgn0004053",
                          "zen",
                          "zerknüllt",
                          "DNA-binding transcription factor activity",
                        ]
                      - [
                          "FBgn0001180",
                          "hb",
                          "hunchback",
                          "DNA-binding transcription factor activity",
                        ]
                    executionTime: 567
                    wasSuccessful: true
                    statusCode: 200
    post:
      tags:
        - query
      summary: Execute a query
      description: |
        Execute a PathQuery to retrieve data from FlyMine using POST method.
      operationId: queryResultsPost
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                format:
                  type: string
                  enum:
                    [
                      tab,
                      csv,
                      count,
                      json,
                      jsonobjects,
                      jsoncount,
                      xml,
                      html,
                      rdf+xml,
                    ]
                  default: tab
                start:
                  type: integer
                  default: 0
                size:
                  type: integer
                  default: 10
                columnheaders:
                  type: string
                  enum: [none, path, friendly]
                  default: none
                token:
                  type: string
            examples:
              transcriptionFactors:
                summary: Query for transcription factors
                value:
                  query: |
                    <query model="genomic" view="Gene.primaryIdentifier Gene.symbol Gene.goAnnotation.ontologyTerm.name">
                      <constraint path="Gene.goAnnotation.ontologyTerm.name" op="CONTAINS" value="transcription factor"/>
                      <constraint path="Gene.organism.name" op="=" value="Drosophila melanogaster"/>
                    </query>
                  format: json
                  size: 20
              eveGenePost:
                summary: POST query for eve gene with JSON format
                value:
                  query: |
                    {
                      "from": "Gene",
                      "select": ["primaryIdentifier", "symbol", "name", "proteins.primaryIdentifier", "proteins.proteinDomains.name"],
                      "where": [
                        {"path": "organism.name", "op": "=", "value": "Drosophila melanogaster"},
                        {"path": "symbol", "op": "=", "value": "eve"}
                      ]
                    }
                  format: jsonobjects
                  size: 10
              chromosomeGenesPost:
                summary: Genes on specific chromosome region
                value:
                  query: |
                    <query model="genomic" view="Gene.primaryIdentifier Gene.symbol Gene.chromosomeLocation.start Gene.chromosomeLocation.end">
                      <constraint path="Gene.chromosome.primaryIdentifier" op="=" value="2L"/>
                      <constraint path="Gene.chromosomeLocation.start" op=">" value="14615455"/>
                      <constraint path="Gene.chromosomeLocation.end" op="<" value="14619002"/>
                      <constraint path="Gene.organism.name" op="=" value="Drosophila melanogaster"/>
                    </query>
                  format: csv
                  columnheaders: friendly
                  size: 50
      responses:
        "200":
          description: Query results

  /query/results/gff3:
    get:
      tags:
        - query
        - export
      summary: Export query results as GFF3
      description: |
        Export sequence features from a query in GFF3 format. Suitable for queries
        returning SequenceFeature objects.
      operationId: queryGFF3Get
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: PathQuery in XML or JSON format selecting sequence features
          example: |
            <query model="genomic" view="Gene.id Gene.exons.id">
              <constraint path="Gene.chromosome.primaryIdentifier" op="=" value="2L"/>
              <constraint path="Gene.chromosomeLocation.start" op=">" value="10000000"/>
              <constraint path="Gene.chromosomeLocation.end" op="<" value="11000000"/>
            </query>
        - name: view
          in: query
          schema:
            type: array
            items:
              type: string
          description: Extra columns to include in the ninth column
          example: ["Gene.symbol", "Gene.length"]
      responses:
        "200":
          description: GFF3 formatted results
          content:
            text/plain:
              schema:
                type: string
              example: |
                ##gff-version 3
                2L	FlyMine	gene	10234567	10245678	.	+	.	ID=FBgn0031208;Name=CG11023;symbol=CG11023;length=11112
                2L	FlyMine	exon	10234567	10234789	.	+	.	Parent=FBgn0031208
                2L	FlyMine	exon	10235001	10235456	.	+	.	Parent=FBgn0031208

  /query/results/fasta:
    get:
      tags:
        - query
        - export
      summary: Export sequences as FASTA
      description: |
        Export biological sequences from a query in FASTA format.
      operationId: queryFASTAGet
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: PathQuery selecting sequence objects
          example: |
            {
              "from": "Gene",
              "select": ["id"],
              "where": [
                {"path": "symbol", "op": "ONE OF", "values": ["eve", "ftz", "zen"]}
              ]
            }
        - name: view
          in: query
          schema:
            type: array
            items:
              type: string
          example: ["Gene.length", "Gene.chromosome.primaryIdentifier"]
      responses:
        "200":
          description: FASTA formatted sequences
          content:
            text/plain:
              schema:
                type: string
              example: |
                >FBgn0000606 type=gene; loc=2R:9979319..9984780; name=eve; length=5462;
                ATGGAGATCAAACAAGCGAAGAGTGGAGAGAAGTGGAGAAGCAGCCAAGCAAG
                CAACAGCACAAGGGCTCGTCGAGCAAGTCCAGCGAGGAGGATCTGCTGAGCGG
                >FBgn0001077 type=gene; loc=3R:2648685..2653456; name=ftz; length=4772;
                ATGGCAATGGAAGTGTCCAGCAGTCCCGTGATGGTTCATCACGTCGGTCGCTC

  /query/results/bed:
    get:
      tags:
        - query
        - export
      summary: Export genomic locations as BED
      description: |
        Export genomic locations from a query in UCSC BED format.
      operationId: queryBEDGet
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: PathQuery selecting sequence features
          example: |
            <query model="genomic" view="Gene.id">
              <constraint path="Gene.goAnnotation.ontologyTerm.name" op="=" value="wing disc development"/>
              <constraint path="Gene.organism.name" op="=" value="Drosophila melanogaster"/>
            </query>
      responses:
        "200":
          description: BED formatted results
          content:
            text/plain:
              schema:
                type: string
              example: |
                # UCSC BED format
                # Source: FlyMine
                track name=FlyMine_Wing_Development description="Wing Development Genes"
                chr2L	7529	9484	CG11023	1000	+
                chr2R	9979319	9984780	eve	1000	-
                chrX	2648220	2653456	runt	1000	+

  /template/results:
    get:
      tags:
        - template
      summary: Execute a template query
      description: |
        Execute a pre-configured template query with parameters.
      operationId: templateResults
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: The name of the template to run
          examples:
            genePathways:
              value: "Gene_Pathways"
              summary: "Template for gene pathways"
            proteinDomains:
              value: "Gene_Protein"
              summary: "Template for gene protein domains"
            flyAtlas:
              value: "Gene_AdultFlyAtlas"
              summary: "Template for FlyAtlas expression"
        - name: constraint1
          in: query
          schema:
            type: string
          description: Constraint path for parameter 1
          examples:
            geneConstraint:
              value: "Gene"
              summary: "Gene constraint"
            geneSymbol:
              value: "Gene.symbol"
              summary: "Gene symbol constraint"
        - name: op1
          in: query
          schema:
            type: string
          description: Constraint operator for parameter 1
          examples:
            lookup:
              value: "LOOKUP"
              summary: "Lookup operator"
            equals:
              value: "="
              summary: "Equals operator"
        - name: value1
          in: query
          schema:
            type: string
          description: Constraint value for parameter 1
          examples:
            eveGene:
              value: "eve"
              summary: "even-skipped gene"
            ftzGene:
              value: "ftz"
              summary: "fushi tarazu gene"
            zenGene:
              value: "zen"
              summary: "zerknullt gene"
            hbGene:
              value: "hb"
              summary: "hunchback gene"
            notchGene:
              value: "Notch"
              summary: "Notch receptor gene"
            winglessGene:
              value: "wingless"
              summary: "wingless signaling gene"
        - name: extra1
          in: query
          schema:
            type: string
          description: Extra constraint value for parameter 1
          example: "D. melanogaster"
        - name: format
          in: query
          schema:
            type: string
            enum: [tab, csv, count, json, jsonobjects, jsoncount, xml, html]
            default: tab
          example: json
        - name: size
          in: query
          schema:
            type: integer
            default: 10
          example: 25
      responses:
        "200":
          description: Template query results
          content:
            application/json:
              schema:
                type: object
              examples:
                genePathwaysResponse:
                  summary: Response for gene pathways template
                  value:
                    results:
                      - ["FBgn0000606", "eve", "Segmentation", "P06602"]
                      - ["FBgn0001077", "ftz", "Segmentation", "P07713"]
                      - [
                          "FBgn0004053",
                          "zen",
                          "Dorsal/ventral axis formation",
                          "P09102",
                        ]
                    executionTime: 145
                    wasSuccessful: true
                    statusCode: 200
                eveProteinDomainsResponse:
                  summary: Response for eve protein domains
                  value:
                    results:
                      - [
                          "FBgn0000606",
                          "eve",
                          "even-skipped",
                          "Homeobox",
                          "DNA binding",
                        ]
                      - [
                          "FBgn0000606",
                          "eve",
                          "even-skipped",
                          "Helix-turn-helix",
                          "DNA binding",
                        ]
                    executionTime: 87
                    wasSuccessful: true
                    statusCode: 200

  /templates:
    get:
      tags:
        - template
      summary: List available templates
      description: Retrieve a list of all available query templates
      operationId: listTemplates
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xml, json]
            default: xml
          description: Output format
          example: json
        - name: includeBroken
          in: query
          schema:
            type: boolean
            default: false
          description: Whether to include invalid templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: object
              example:
                templates:
                  Gene_Pathways:
                    title: "Gene --> Pathways"
                    description: "Show all pathways for a particular gene."
                    comment: "Shows any pathways that the gene is part of"
                    tags: ["im:aspect:Pathways", "im:public"]
                    select:
                      [
                        "Gene.symbol",
                        "Gene.pathways.name",
                        "Gene.pathways.identifier",
                      ]
                    where:
                      - path: "Gene"
                        op: "LOOKUP"
                        value: "eve"
                        editable: true
                  Organism_Protein:
                    title: "All proteins for organism"
                    description: "Show all proteins for a particular organism"
                    select: ["Protein.primaryIdentifier", "Protein.name"]

  /lists:
    get:
      tags:
        - list
      summary: Get lists
      description: Retrieve lists accessible to the user
      operationId: getLists
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Optional filter by name
          examples:
            favoriteGenes:
              value: "My_Favorite_Genes"
              summary: "User's favorite genes list"
            hoxGenes:
              value: "Hox_genes"
              summary: "Homeotic genes list"
            gapGenes:
              value: "Gap_Genes"
              summary: "Gap genes list"
            developmentalGenes:
              value: "Developmental_Genes"
              summary: "Developmental genes list"
            transcriptionFactors:
              value: "TF_List"
              summary: "Transcription factors list"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, html, text, csv, tab]
            default: json
        - name: token
          in: query
          schema:
            type: string
          description: Authentication token
      responses:
        "200":
          description: User's lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items:
                      type: object
              examples:
                userLists:
                  summary: User's gene lists
                  value:
                    lists:
                      - name: "PL FlyBase_Annotation_IDs"
                        size: 35807
                        type: "Gene"
                        dateCreated: "2023-01-15T10:30:00Z"
                        description: "All FlyBase gene IDs"
                        tags: ["im:public", "im:aspect:Genes"]
                      - name: "Gap_Genes"
                        size: 9
                        type: "Gene"
                        dateCreated: "2023-03-20T14:15:00Z"
                        description: "Drosophila gap genes (eve, ftz, hb, Kr, etc.)"
                        tags: ["im:private", "im:aspect:Development"]
                      - name: "Hox_genes"
                        size: 8
                        type: "Gene"
                        dateCreated: "2023-03-20T14:15:00Z"
                        description: "Drosophila Hox complex genes"
                        tags: ["im:private", "im:aspect:Development"]
                      - name: "Notch_Pathway"
                        size: 156
                        type: "Gene"
                        dateCreated: "2023-05-10T09:45:00Z"
                        description: "Genes involved in Notch signaling pathway"
                        tags: ["im:private", "im:aspect:Signaling"]
    post:
      tags:
        - list
      summary: Create a new list
      description: Create a new list by uploading identifiers
      operationId: createList
      requestBody:
        content:
          text/plain:
            schema:
              type: string
              description: Identifiers separated by commas, tabs, or newlines
            examples:
              gapGenes:
                summary: Gap genes as plain text
                value: |
                  eve
                  ftz
                  zen
                  hb
                  Kr
                  kni
                  gt
                  tll
                  hkb
              hoxGenes:
                summary: Hox genes with FlyBase IDs
                value: |
                  FBgn0000577,Dfd
                  FBgn0003963,Scr
                  FBgn0001180,pb
                  FBgn0004053,zen
                  FBgn0000606,eve
              notchPathwayGenes:
                summary: Notch signaling pathway genes
                value: |
                  Notch
                  Delta
                  Serrate
                  fringe
                  big brain
                  neuralized
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                  description: Name for the new list
                type:
                  type: string
                  description: Type of objects in the list
                description:
                  type: string
                extraValue:
                  type: string
                replaceExisting:
                  type: boolean
                  default: false
                token:
                  type: string
            examples:
              gapGenesList:
                summary: Create gap genes list
                value:
                  name: "Gap_Genes"
                  type: "Gene"
                  description: "Drosophila gap genes involved in segmentation"
                  extraValue: "D. melanogaster"
                  token: ""
              hoxGenesList:
                summary: Create Hox genes list
                value:
                  name: "Hox_Genes"
                  type: "Gene"
                  description: "Homeotic genes controlling body segment identity"
                  extraValue: "D. melanogaster"
                  replaceExisting: false
                  token: ""
              notchPathwayList:
                summary: Create Notch pathway genes list
                value:
                  name: "Notch_Signaling_Genes"
                  type: "Gene"
                  description: "Genes involved in Notch signaling pathway"
                  extraValue: "D. melanogaster"
                  token: ""
      responses:
        "200":
          description: List created successfully
          content:
            application/json:
              example:
                listName: "Gap_Genes"
                size: 9
                type: "Gene"
                wasSuccessful: true
                unmatchedIdentifiers: []
    delete:
      tags:
        - list
      summary: Delete a list
      description: Delete a list belonging to the authenticated user
      operationId: deleteList
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Name of the list to delete
          example: "Old_Gene_List"
        - name: token
          in: query
          required: true
          schema:
            type: string
          example: ""
      responses:
        "200":
          description: List deleted successfully

  /search:
    get:
      tags:
        - search
      summary: Keyword search
      description: |
        Perform a keyword search across FlyMine data with faceting support
      operationId: search
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query string
          examples:
            notchSignaling:
              value: "notch signaling"
              summary: "Search for Notch signaling"
            developmentalGenes:
              value: "even skipped fushi tarazu"
              summary: "Search for developmental genes"
            eveGene:
              value: "eve"
              summary: "Search for eve gene"
            transcriptionFactors:
              value: "transcription factor"
              summary: "Search for transcription factors"
            winglessPathway:
              value: "wingless wnt"
              summary: "Search for wingless/Wnt pathway"
            dnaBinding:
              value: "DNA binding protein"
              summary: "Search for DNA binding proteins"
        - name: size
          in: query
          schema:
            type: integer
            default: 10
          description: Maximum number of results
          example: 20
        - name: start
          in: query
          schema:
            type: integer
            default: 0
          description: Index of first result
        - name: facet_Category
          in: query
          schema:
            type: string
          description: Filter by category facet
          example: "Gene"
        - name: list
          in: query
          schema:
            type: string
          description: Search within a specific list
          example: "PL_FlyBase_IDs"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  facets:
                    type: object
                  results:
                    type: array
                    items:
                      type: object
              examples:
                notchSignalingSearch:
                  summary: Search results for "notch signaling"
                  value:
                    facets:
                      Category:
                        Gene: 156
                        Pathway: 12
                        Publication: 843
                        GOTerm: 23
                      organism:
                        "D. melanogaster": 178
